[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xlong-market-maker"
version = "0.1.0"
description = "Production-oriented market making system for BitMart-first deployment."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
live = [
  "httpx>=0.27",
  "websockets>=12",
  "pydantic>=2",
]
dev = [
  "pytest>=8",
]

[project.scripts]
mm = "mm.main:main"

[tool.setuptools.packages.find]
where = ["src"]

